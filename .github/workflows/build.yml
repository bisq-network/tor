name: Build Tor

on:
  push:
  pull_request:
    types: [ opened, reopened, synchronize, closed ]
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        # macos-15 is arm64; macos-15-intel keeps Intel macOS coverage explicit.
        # A repository can set BUILD_LINUX_ONLY to true to build on Ubuntu only. The variable only selects one of the
        # two checked-in runner lists, so every runner label stays reviewed and verified.
        os: ${{ fromJSON(vars.BUILD_LINUX_ONLY == 'true' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "macos-15-intel", "macos-15", "windows-2025"]') }}

    runs-on: ${{ matrix.os }}
    # The build runs the tests. A test which hangs would otherwise hold the runner for the default limit of 6 hours.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Gradle wrapper checksums
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c gradle/wrapper/gradle-wrapper.sha256
          else
            shasum -a 256 -c gradle/wrapper/gradle-wrapper.sha256
          fi

      - name: Setup Java JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'zulu'
          check-latest: true

      # "Verify Gradle wrapper checksums" compares the wrapper with checksums which this repository states itself.
      # setup-gradle checks gradle-wrapper.jar against the checksums which Gradle publishes; it is on by default, and set
      # here so that it stays on.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Build with Gradle
        shell: bash
        run: ./gradlew build

      # Bisq 1 builds with the configuration cache. The tasks which package the Tor bundle must store a cache entry,
      # reuse it, and with it create their outputs again after they were deleted.
      - name: Check the bundle tasks with the configuration cache
        shell: bash
        run: |
          ./gradlew --configuration-cache :tor:packageTorBinary
          ./gradlew --configuration-cache :tor:packageTorBinary | tee "$RUNNER_TEMP/cc-reuse.log"
          grep -q 'Configuration cache entry reused' "$RUNNER_TEMP/cc-reuse.log"
          rm -rf tor/build/tor_binary tor/build/generated/src/main/resources/tor.zip
          ./gradlew --configuration-cache :tor:packageTorBinary | tee "$RUNNER_TEMP/cc-recreate.log"
          grep -q 'Configuration cache entry reused' "$RUNNER_TEMP/cc-recreate.log"
          test -s tor/build/generated/src/main/resources/tor.zip

      # The report is regenerated by hand after a change of the dependencies or of the verification metadata. It
      # depends on neither the operating system nor the architecture, so one job checks that it is up to date.
      - name: Check the dependency signature report
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./gradlew dependencySignatureReport
          git diff --exit-code -- docs/dependency-signature-report.md

      # Every task of build must store its state in a configuration cache entry, except the tasks which resolve and
      # verify the dependencies in each invocation and are declared incompatible. The checks and the POM tasks must
      # also work from a reused entry.
      - name: Check the tasks of the build with the configuration cache
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./gradlew --configuration-cache --dry-run build
          tasks="verifyGithubActionsSecurity verifyGradleWrapperSecurity verifyBuildEnvironment generatePomFileForMavenJavaPublication"
          ./gradlew --configuration-cache $tasks
          ./gradlew --configuration-cache $tasks | tee "$RUNNER_TEMP/cc-checks.log"
          grep -q 'Configuration cache entry reused' "$RUNNER_TEMP/cc-checks.log"

  # The integration tests start Tor: in the sandbox of sandy, on a private Tor network on the runner, and as an external
  # Tor. They check the sandbox of Linux, so they run on Linux only.
  integration-test:
    name: Integration tests on ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Gradle wrapper checksums
        shell: bash
        run: sha256sum -c gradle/wrapper/gradle-wrapper.sha256

      - name: Setup Java JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'zulu'
          check-latest: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          validate-wrappers: true

      # The private Tor network creates the keys of its relays with tor and tor-gencert of PATH, which no Linux expert
      # bundle has. The probes of SandboxEnforcementTest run busybox in the sandbox.
      - name: Install tor and busybox
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tor busybox

      # AppArmor restricts unprivileged user namespaces on Ubuntu 24.04, so sandy would fall back to host-network there,
      # and the tests of the levels which most Linux hosts enforce (base, and contained with its PID namespace) would
      # skip themselves. SandboxEnforcementTest runs host-network by its name in any case.
      - name: Allow unprivileged user namespaces
        shell: bash
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The results depend on the runner, which is no input of the tasks, so a result from the build cache would not
      # show whether the tests pass here.
      - name: Run the integration tests
        shell: bash
        run: ./gradlew --continue integrationTest --rerun

      # A test skips itself where the host cannot enforce its level. A change of the runner image must not turn the
      # sandbox tests off unnoticed.
      - name: Check that no sandbox test was skipped
        shell: bash
        run: |
          report=tor/build/test-results/integrationTest/TEST-bisq.network.tor.SandboxEnforcementTest.xml
          if ! grep -q '<testsuite [^>]*skipped="0"' "$report"; then
            echo "SandboxEnforcementTest skipped tests, so this runner cannot enforce every level they check: $report" >&2
            exit 1
          fi
